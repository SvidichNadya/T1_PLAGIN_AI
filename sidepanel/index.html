<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work Copilot</title><link rel="stylesheet" href="style.css"></head><body><div id="app">
<header class="topbar"><div class="brand"><span class="logo">✦</span><div><b>WORK COPILOT</b><small>LOCAL ANALYTICS AGENT</small></div></div><div class="top-actions"><button id="notesBtn" class="icon" title="Быстрые заметки">✎</button><button id="clearBtn" class="icon" title="Очистить контекст">⌫</button></div></header>
<section class="agent-shell"><div class="agent-top"><div><span class="eyebrow">AI-АНАЛИТИК</span><h1>Что нужно проверить?</h1><p>Анализирует только материалы текущей разработки.</p></div><span class="mode-badge">FAST · LOCAL</span></div><div class="agent-input"><textarea id="agentInput" rows="2" placeholder="Например: сравни требования с целевым документом и покажи пропуски"></textarea><button id="askAgent" class="send">↗</button></div><div class="quick-actions"><button data-agent-query="Сделай резюме контекста">Резюме</button><button data-agent-query="Найди противоречия и покажи доказательства">Противоречия</button><button data-agent-query="Какие требования пропущены?">Пропуски</button><button data-agent-query="Какие открытые вопросы остались?">Вопросы</button></div><div id="agentResult" class="agent-result"></div></section>
<section class="dev-head"><span class="eyebrow">КОНТЕКСТ РАЗРАБОТКИ</span><input id="taskName" placeholder="Название разработки"><div class="chips"><span id="docCount">0 источников</span><span id="taskCount">0 рабочих задач</span><span id="issueCount">0 проблем</span></div></section>
<nav class="main-nav"><button data-view="overview" class="active">Контекст</button><button data-view="sources">Источники</button><button data-view="analysis">Анализ</button><button data-view="organization">Организация</button></nav><main id="content"></main></div>
<div id="notesOverlay" class="notes-overlay" hidden><div id="notesWindow" class="notes-window"><div class="notes-titlebar"><b>Быстрые заметки</b><button id="closeNotes" class="icon">×</button></div><textarea id="quickNote" placeholder="Пишите заметки поверх текущей страницы..."></textarea><div class="notes-footer"><span>Заметка сохраняется в текущий контекст.</span><button id="saveNote" class="btn primary">Сохранить</button></div></div></div>
<script src="../core/utils.js"></script><script src="../core/model.js"></script><script src="../core/extract.js"></script><script src="../core/analyze.js"></script><script src="../core/requirements.js"></script><script src="../core/context.js"></script><script src="../core/calendar.js"></script><script src="../core/ai.js"></script><script src="app.js"></script></body></html>
